# Skali — Render Blueprint (web deploy)
# Backend = FastAPI web service, Frontend = static Vite SPA.
# Secrets (sync:false) must be filled in the Render dashboard; NEVER commit real values.
services:
  # ---------------- Backend (FastAPI) ----------------
  - type: web
    name: skali-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL          # MongoDB Atlas URI (Render has no built-in Mongo)
        sync: false
      - key: DB_NAME
        value: skali
      - key: SUPABASE_URL
        value: https://ixahrtibbpjruggivjik.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY   # SECRET — set in Render dashboard, never commit
        sync: false
      - key: SUPABASE_JWT_SECRET          # SECRET — set in Render dashboard, never commit
        sync: false
      - key: SUPABASE_BUCKET
        value: skali-media
      - key: DM_ENC_KEY         # base64 32-byte key; keep STABLE or old DMs won't decrypt
        sync: false
      - key: CSAM_STEPUP_SECRET_HASH  # SHA-256 hash of the CSAM/DM step-up secret (owner sets)
        sync: false
      - key: SEED_ADMIN_EMAIL   # bootstrap super-admin email
        sync: false
      - key: SEED_ADMIN_PASSWORD  # bootstrap super-admin password — SECRET, env only
        sync: false
      # Block 2 — verification webhook secrets (HMAC-SHA256; fail-closed if unset)
      - key: YOTI_WEBHOOK_SECRET
        sync: false
      - key: ONEID_WEBHOOK_SECRET
        sync: false
      # Block 3 — PSP webhook secrets (HMAC-SHA256; fail-closed if unset)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: XSOLLA_WEBHOOK_SECRET
        sync: false
      - key: CCBILL_WEBHOOK_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ADMIN_EMAILS       # comma-separated admin emails (your Google email)
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON  # Firebase Admin service-account JSON (single line) for server-side FCM push
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://skaliapp.com
      - key: GIPHY_API_KEY        # GIPHY developer API key (server-side GIF search proxy)
        sync: false

  # ---------------- Frontend (static Vite SPA) ----------------
  - type: web
    name: skali-web
    runtime: static
    buildCommand: yarn install && yarn build
    staticPublishPath: dist
    routes:
      - type: rewrite       # SPA: send all paths to index.html for react-router
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_SUPABASE_URL
        value: https://ixahrtibbpjruggivjik.supabase.co
      - key: REACT_APP_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4YWhydGliYnBqcnVnZ2l2amlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDI2NjMsImV4cCI6MjEwNDk3ODY2M30.4yKosj4HuCrPp5Rw[...]
      - key: REACT_APP_GOOGLE_WEB_CLIENT_ID
        # Web OAuth client in the SAME Google Cloud project (skaliapp-e0dee) as the
        # Android client. Must match nativeGoogle.ts + the android-apk.yml default,
        # otherwise native Google sign-in throws [16] "reauth failed".
        value: 572913753788-il245hv6t2tss0bc097c4jfk4cumpii8.apps.googleusercontent.com
      - key: REACT_APP_API_URL   # absolute backend URL (e.g. https://skali-backend.onrender.com)
        sync: false
