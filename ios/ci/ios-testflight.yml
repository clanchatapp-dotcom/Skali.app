name: iOS TestFlight

on:
  push:
    branches: [ beta-test ]
  workflow_dispatch:

env:
  APPLE_TEAM_ID: N58G8L5K39
  ASC_KEY_ID: 3K86928U5U
  ASC_ISSUER_ID: 2e273a5f-e735-433c-9fd6-b590f24cefbb

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Yarn
        run: corepack enable || npm i -g yarn

      - name: Write frontend .env
        run: |
          cat > .env <<EOF
          REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL || 'https://ixahrtibbpjruggivjik.supabase.co' }}
          REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4YWhydGliYnBqcnVnZ2l2amlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDI2NjMsImV4cCI6MjEwNDk3ODY2M30.4yKosj4HuCrPp5Rw1KZ9rGejkzkQdWJAHTO9-QEuCTU' }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_WEB_CLIENT_ID || '572913753788-il245hv6t2tss0bc097c4jfk4cumpii8.apps.googleusercontent.com' }}
          REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL || 'https://clanchatapp-backend.onrender.com' }}
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL || 'https://clanchatapp-backend.onrender.com' }}
          EOF

      - name: Install deps
        run: yarn install --frozen-lockfile || yarn install

      - name: Build web
        run: yarn build

      - name: Capacitor sync
        run: npx cap sync ios

      # Optional: without it the app builds fine, but iPhone push stays off.
      - name: Add Firebase config (push)
        env:
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then printf '%s' "$PLIST" > ios/App/App/public/GoogleService-Info.plist; echo "Firebase plist added"; else echo "IOS_GOOGLE_SERVICE_INFO_PLIST not set - push disabled"; fi

      - name: Pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Add the APP_STORE_CONNECT_API_KEY_P8 repo secret"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Signing + upload live in ios/ci/testflight.sh so they can change without editing this file.
      - name: Build and upload to TestFlight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash ios/ci/testflight.sh

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
